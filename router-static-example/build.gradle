plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    // InfraMesh Node SDK — Router contract (RoutingRequest/RoutingHints/WorkerCandidate/
    // RoutingResponse), Node health contract, and common node integration components.
    implementation 'io.github.inframeshai:inframesh-node:0.1.2'

    // Web Application
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // No Spring AI / LLM SDK on purpose — this Router selects a Worker with a
    // deterministic weighted score over Worker runtime metrics (see StaticRouterServiceImpl).

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

springBoot {
    mainClass = 'koboolean.staticrouter.StaticRouterApplication'
}
